framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Les emails partent en synchrone, volontairement : le stack ne
            # fait tourner aucun worker Messenger, et une file que personne ne
            # consomme signifie des emails de vérification jamais reçus, sans
            # la moindre erreur visible.
            # À rebasculer sur « async » le jour où un service worker est
            # ajouté au compose (et MESSENGER_TRANSPORT_DSN doté d'auto_setup).
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async
