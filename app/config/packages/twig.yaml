twig:
    file_name_pattern: '*.twig'
    globals:
        # Disponibles dans tout gabarit : le pied de page les affiche sur
        # chacune des deux coques.
        version: '%app.version%'
        depot: '%app.depot%'
    form_themes:
        # Thème Tailwind fourni par Symfony. Nommé « 2 » d'après la version de
        # Tailwind de l'époque, il reste compatible v4 : il n'utilise que des
        # classes utilitaires stables. Surchargé par templates/form/theme.html.twig
        # pour la palette du projet.
        - 'tailwind_2_layout.html.twig'
        - 'form/theme.html.twig'

when@test:
    twig:
        strict_variables: true
