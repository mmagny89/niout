# Override developpement. Autosuffisant avec compose.yml seul :
#   docker compose -f compose.yml -f compose.dev.yml up -d
# (ou "docker compose up -d" nu, via COMPOSE_FILE du .env racine).
services:
  php:
    build:
      target: dev
    image: niout-php:dev
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE}
    volumes:
      - ./app:/app
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${HTTP3_PORT}:443/udp"

  database:
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  ember:
    ports:
      - "${EMBER_PORT}:9191"
