# Override prod. Serveur partage : un VPS ou Traefik tient seul les ports 80 et
# 443 pour plusieurs projets. Lancement toujours explicite :
#   docker compose -f compose.yml -f compose.prod.yml --env-file .env.prod.local up -d --wait
# --env-file REMPLACE le .env racine (conventions, section 3).
#
# Prerequis, une seule fois sur l'hote : `docker network create traefik`, et un
# Traefik branche dessus (pas en network_mode: host, qui l'empeche de joindre
# les conteneurs par leur nom).
services:
  php:
    # Capabilities reduites au strict necessaire. NET_BIND_SERVICE est la seule
    # indispensable : frankenphp ecoute sur le port 80, et la capability posee sur
    # son binaire au build (setcap) ne sert a rien si le conteneur la perd. Un
    # cap_drop: ALL seul : « exec: frankenphp: Operation not permitted ».
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    build:
      target: prod
    image: niout-php:prod
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET est requis en prod (secret applicatif Symfony) — fournir via --env-file .env.prod.local}
      # `:80` coupe l'auto-TLS de Caddy : derriere Traefik, le certificat et la
      # redirection HTTP sont l'affaire du proxy. Deux ACME concurrents sur le
      # meme domaine se disputeraient le challenge.
      SERVER_NAME: ":80"
    # Defense en profondeur : le binaire frankenphp recoit
    # cap_net_bind_service au build (stage prod) ; ce sysctl autorise le
    # bind sur les ports <1024 par l'utilisateur non root independamment
    # de la capability (symfony-docker.md, "Pieges connus").
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    # Aucun `ports:` — sur un serveur partage, Traefik seul publie sur l'hote.
    # C'est ce qui leve l'arbitrage de ports de la section 4 : plusieurs projets
    # cohabitent sans se marcher dessus.
    networks:
      - niout
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.niout-prod.rule: Host(`${SERVER_HOST:?SERVER_HOST est requis en prod (domaine public, ex. niout.mmagny.fr) — fournir via --env-file .env.prod.local}`)
      traefik.http.routers.niout-prod.entrypoints: websecure
      traefik.http.routers.niout-prod.tls.certresolver: letsencrypt
      traefik.http.services.niout-prod.loadbalancer.server.port: "80"

  database:
    # Le moteur demarre en root, cree son repertoire de donnees et bascule sur
    # son utilisateur : CHOWN, SETUID, SETGID, DAC_OVERRIDE et FOWNER suffisent.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

networks:
  # Cree hors de tout stack et partage par tous les projets du VPS : Compose ne
  # doit ni le creer ni le detruire, d'ou `external`.
  traefik:
    name: traefik
    external: true
