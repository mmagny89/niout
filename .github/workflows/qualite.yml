name: Qualité

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le code applicatif vit dans app/ ; la racine ne porte que l'infrastructure
# Docker (voir .claude/rules/stack-conventions.md).
defaults:
  run:
    working-directory: app

env:
  # Alignée sur PHP_VERSION du .env racine, elle-même la version de l'image
  # de production. Ne jamais tester sur une version plus récente que la prod.
  PHP_VERSION: '8.4'
  # En local, DATABASE_URL est injectée par compose.yml et volontairement
  # commentée dans app/.env (conventions, règle de non-duplication). La CI
  # n'utilise pas Docker Compose : sans cette ligne, le post-install-cmd de
  # Composer (auto-scripts → cache:clear) échoue à compiler le conteneur avec
  # « Environment variable not found: DATABASE_URL », y compris sur les jobs
  # qui ne touchent jamais la base.
  DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=18&charset=utf8

jobs:
  lint:
    name: Style de code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: app
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  analyse-statique:
    name: Analyse statique
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: app
      # PHPStan lit le container compilé pour résoudre les services : il doit
      # exister avant l'analyse, sinon l'extension Symfony reste aveugle.
      - run: php bin/console cache:warmup --env=dev
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  audit-securite:
    name: Audit des dépendances
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: app
      - run: composer audit

  tests:
    name: Tests unitaires et d'intégration
    needs: analyse-statique
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: app
      # En environnement de test, doctrine.yaml ajoute le suffixe défini par
      # dbname_suffix : la base visée est app_test, pas app. Le service
      # PostgreSQL ne crée que POSTGRES_DB, il faut donc créer l'autre.
      - run: php bin/console doctrine:database:create --if-not-exists --env=test
      - run: php bin/console doctrine:migrations:migrate --no-interaction --env=test
      # La CSS compilée vit dans app/var/, ignoré par git : sans cette étape,
      # AssetMapper cherche « tailwindcss » comme un fichier réel, base.html.twig
      # lève une exception, et tout test qui rend une page échoue.
      - run: php bin/console tailwind:build
      - run: php bin/phpunit

  # ---------------------------------------------------------------------------
  # Déploiement — uniquement sur push vers main, jamais sur une pull request,
  # et seulement une fois les quatre portes passées. `needs` porte les deux
  # jobs terminaux : lint et analyse-statique sont déjà leurs prérequis.
  deploiement:
    name: Déploiement en production
    needs: [audit-securite, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deux déploiements simultanés se marcheraient dessus sur le VPS (même
    # dossier, même stack Docker). `cancel-in-progress: false` : on ne coupe
    # jamais un déploiement en cours, on attend son tour.
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    # Ce job ne fait pas de checkout : il n'a rien à lire du dépôt, et le
    # working-directory `app` du haut de fichier n'existerait donc pas.
    defaults:
      run:
        working-directory: .
    steps:
      # Un secret absent produirait sinon un « ssh "@" » et une page d'usage
      # illisible : GitHub remplace une variable inconnue par une chaîne vide,
      # sans jamais le signaler. Défaut réel, payé au premier déclenchement.
      - name: Vérifie que les secrets sont posés
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          manquants=''
          for nom in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            eval "valeur=\$$nom"
            [ -n "$valeur" ] || manquants="$manquants $nom"
          done
          if [ -n "$manquants" ]; then
            echo "Secrets manquants :$manquants" >&2
            echo "À poser dans Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      - name: Prépare la connexion SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          # L'empreinte du serveur est vérifiée : sans known_hosts, il faudrait
          # désactiver StrictHostKeyChecking, ce qui reviendrait à accepter
          # n'importe quel serveur se présentant à cette adresse.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Tout le déploiement vit dans /usr/local/bin/niout-deploie sur le VPS,
      # pas ici : les chemins et les secrets restent sur le serveur, et la clé
      # confiée à GitHub ne peut lancer que ce script (forced command dans
      # authorized_keys).
      - name: Déploie sur le VPS
        run: >-
          ssh -i ~/.ssh/id_deploiement
          -o BatchMode=yes
          "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          niout-deploie
