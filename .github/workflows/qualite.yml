name: Qualité

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le code applicatif vit dans app/ ; la racine ne porte que l'infrastructure
# Docker (voir .claude/rules/stack-conventions.md).
defaults:
  run:
    working-directory: app

env:
  # Alignée sur PHP_VERSION du .env racine, elle-même la version de l'image
  # de production. Ne jamais tester sur une version plus récente que la prod.
  PHP_VERSION: '8.4'
  # En local, DATABASE_URL est injectée par compose.yml et volontairement
  # commentée dans app/.env (conventions, règle de non-duplication). La CI
  # n'utilise pas Docker Compose : sans cette ligne, le post-install-cmd de
  # Composer (auto-scripts → cache:clear) échoue à compiler le conteneur avec
  # « Environment variable not found: DATABASE_URL », y compris sur les jobs
  # qui ne touchent jamais la base.
  DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=18&charset=utf8

jobs:
  lint:
    name: Style de code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: app
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  analyse-statique:
    name: Analyse statique
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: app
      # PHPStan lit le container compilé pour résoudre les services : il doit
      # exister avant l'analyse, sinon l'extension Symfony reste aveugle.
      - run: php bin/console cache:warmup --env=dev
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github

  audit-securite:
    name: Audit des dépendances
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: app
      - run: composer audit

  tests:
    name: Tests unitaires et d'intégration
    needs: analyse-statique
    runs-on: ubuntu-latest
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: app
      # En environnement de test, doctrine.yaml ajoute le suffixe défini par
      # dbname_suffix : la base visée est app_test, pas app. Le service
      # PostgreSQL ne crée que POSTGRES_DB, il faut donc créer l'autre.
      - run: php bin/console doctrine:database:create --if-not-exists --env=test
      - run: php bin/console doctrine:migrations:migrate --no-interaction --env=test
      # La CSS compilée vit dans app/var/, ignoré par git : sans cette étape,
      # AssetMapper cherche « tailwindcss » comme un fichier réel, base.html.twig
      # lève une exception, et tout test qui rend une page échoue.
      - run: php bin/console tailwind:build
      - run: php bin/phpunit

  # ---------------------------------------------------------------------------
  # Déploiement — uniquement sur push vers main, jamais sur une pull request,
  # et seulement une fois les quatre portes passées. `needs` porte les deux
  # jobs terminaux : lint et analyse-statique sont déjà leurs prérequis.
  deploiement:
    name: Déploiement en production
    needs: [audit-securite, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deux déploiements simultanés visent le même dossier et le même stack sur
    # l'hôte : on attend son tour, on ne coupe jamais un déploiement en cours.
    concurrency:
      group: deploiement-${{ github.ref_name }}
      cancel-in-progress: false
    # Ce job ne fait pas de checkout : il n'a rien à lire du dépôt, et le
    # working-directory `app` du haut de fichier n'existerait donc pas.
    defaults:
      run:
        working-directory: .
    steps:
      # GitHub remplace un secret absent par une chaîne vide, sans rien
      # signaler : `ssh "@"` produit alors une page d'usage illisible au lieu
      # d'une erreur. Quelques lignes évitent de chercher une heure.
      # Défaut réel, payé au premier déclenchement.
      - name: Contrôler la présence des secrets
        env:
          HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          UTILISATEUR: ${{ secrets.DEPLOIEMENT_UTILISATEUR }}
          CLE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          EMPREINTES: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          manquants=""
          [ -n "$HOTE" ]        || manquants="$manquants DEPLOIEMENT_HOTE"
          [ -n "$UTILISATEUR" ] || manquants="$manquants DEPLOIEMENT_UTILISATEUR"
          [ -n "$CLE" ]         || manquants="$manquants DEPLOIEMENT_CLE_PRIVEE"
          [ -n "$EMPREINTES" ]  || manquants="$manquants DEPLOIEMENT_KNOWN_HOSTS"
          if [ -n "$manquants" ]; then
            echo "Secrets manquants :$manquants" >&2
            echo "À définir dans Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

      # Les secrets passent par `env:` et jamais en interpolation directe dans
      # `run:` — une valeur interpolée est recopiée telle quelle dans le script,
      # donc interprétée par le shell.
      - name: Préparer SSH
        env:
          HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          CLE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          EMPREINTES: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          # Empreinte épinglée, jamais StrictHostKeyChecking=no : ce serait
          # accepter n'importe quel serveur se présentant à cette adresse.
          printf '%s\n' "$EMPREINTES" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Une empreinte de serveur est publique : l'afficher ne divulgue rien
          # et rend diagnosticable le « Host key verification failed », qui
          # vient presque toujours d'une adresse discordante — known_hosts est
          # indexé par l'adresse exacte de connexion, une IP et un nom de
          # domaine y étant deux entrées distinctes.
          echo "Adresse visée : $HOTE"
          echo 'Entrées de known_hosts :'
          ssh-keygen -lf ~/.ssh/known_hosts || echo 'known_hosts illisible ou vide'

      # La logique de déploiement vit sur l'hôte, dans outils/deployer.sh : les
      # chemins et les secrets ne quittent pas le serveur, et la clé confiée à
      # GitHub est restreinte à ce seul script par une forced command dans
      # authorized_keys. Celle-ci ignorant la commande envoyée par le client,
      # le mot ci-dessous n'est qu'une trace lisible dans les journaux.
      - name: Déclencher le déploiement
        env:
          HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          UTILISATEUR: ${{ secrets.DEPLOIEMENT_UTILISATEUR }}
        run: |
          ssh -i ~/.ssh/id_deploiement \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$UTILISATEUR@$HOTE" deployer
