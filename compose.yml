# Socle commun a tous les environnements (conventions, section 1). Genere
# par .claude/scripts/setup-symfony.sh.
name: niout-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}

services:
  php:
    container_name: niout-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: ${TARGET}
      args:
        PHP_VERSION: ${PHP_VERSION}
        FRANKENPHP_VERSION: ${FRANKENPHP_VERSION}
        PHP_EXTENSION_INSTALLER_VERSION: ${PHP_EXTENSION_INSTALLER_VERSION}
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
    image: niout-php:${TARGET}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=${POSTGRES_VERSION}&charset=utf8
      RUN_MIGRATIONS: ${RUN_MIGRATIONS}
      # Le transport des emails vient d'ici et de nulle part ailleurs : la
      # valeur d'app/.env est neutralisee (regle de non-duplication). Sans
      # cette injection, Symfony retombait sur le null:// de la recette Flex,
      # qui accepte chaque message et le jette sans un mot.
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN manquant — transport des emails, a declarer dans le fichier de secrets}
      MAILER_FROM: ${MAILER_FROM:?MAILER_FROM manquant — adresse expeditrice des emails}
      # Sans point-virgule avant le « ? » : la valeur vide est legitime en
      # developpement, ou rien ne s'interpose. C'est l'oubli de la declaration
      # qui doit echouer, pas la valeur vide.
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES?SYMFONY_TRUSTED_PROXIES non declaree — vide en dev, private_ranges derriere un proxy}
    volumes:
      - niout-caddy-data:/data
      - niout-caddy-config:/config
      - niout-caddy-admin:/run/caddy
    networks:
      - niout
    depends_on:
      database:
        condition: service_healthy

  database:
    container_name: niout-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-database
    image: postgres:${POSTGRES_VERSION}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ : monter le repertoire parent, pas .../data
      # (conventions, section 16 — verifier a chaque montee de version
      # majeure, ce chemin n'est pas garanti stable).
      - niout-database-data:/var/lib/postgresql
    networks:
      - niout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sans profil ici (conventions, section 9) : les overrides staging/prod
  # lui en ajoutent un, jamais l'inverse.
  ember:
    container_name: niout-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-ember
    image: ghcr.io/alexandre-daubois/ember:${EMBER_VERSION}
    restart: unless-stopped
    environment:
      EMBER_ADDR: unix//run/caddy/admin.sock
    volumes:
      - niout-caddy-admin:/run/caddy
    networks:
      - niout
    depends_on:
      - php

networks:
  niout:
    name: niout-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}

volumes:
  niout-caddy-data:
    name: niout-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-caddy-data
  niout-caddy-config:
    name: niout-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-caddy-config
  niout-caddy-admin:
    name: niout-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-caddy-admin
  niout-database-data:
    name: niout-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-database-data
